name: Send QT to KakaoTalk

on:
  push:
    paths: ["qt/**"]
  workflow_dispatch:

jobs:
  send:
    # Claude가 초안(공유글 포함)을 커밋했을 때만 전송
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'QT draft:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Send share post
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_TEXT_LIMIT: ${{ vars.KAKAO_TEXT_LIMIT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          QT_NOTE_URL_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}
        run: python scripts/kakao.py send
