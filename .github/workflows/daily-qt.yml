name: Daily QT

on:
  schedule:
    # 04:17, 05:17, 06:17 KST에 시도. 노트가 이미 있으면 건너뛴다(사이트가 새벽에 응답하지 않을 때 대비)
    - cron: "17 19-21 * * *"
  workflow_dispatch:
    inputs:
      no_ai:
        description: "Claude 초안 없이 빈 양식만 작성"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  qt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write today's QT note
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QT_MODEL: ${{ vars.QT_MODEL }}
          QT_INCLUDE_COMMENTARY: ${{ vars.QT_INCLUDE_COMMENTARY }}
        run: python scripts/daily_qt.py ${{ inputs.no_ai && '--no-ai' || '' }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qt
          git diff --cached --quiet && exit 0
          git commit -m "QT: $(TZ=Asia/Seoul date +%F)"
          git push
